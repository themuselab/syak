name: diag-events

# 할인 수집 실패 원인 진단(수동 실행). 저장 안 함 — 응답 종류만 센다.
on:
  workflow_dispatch:
    inputs:
      n:
        description: "표본 수"
        default: "60"

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check booking and Place responses through the shared request budget
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          SAMPLE_COUNT: ${{ inputs.n }}
        run: python scraper/public_source_diagnostics.py
