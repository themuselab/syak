name: general-shop-refresh
run-name: general-shop-refresh-${{ inputs.kind || (github.event.schedule == '9,24,39,54 * * * *' && 'metadata' || 'slots') }}

on:
  schedule:
    - cron: '1,16,31,46 * * * *'
    - cron: '9,24,39,54 * * * *'
  workflow_dispatch:
    inputs:
      kind:
        type: choice
        options: [slots, metadata]
        default: slots

permissions:
  contents: read

concurrency:
  group: general-shop-${{ inputs.kind || (github.event.schedule == '9,24,39,54 * * * *' && 'metadata' || 'slots') }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh due shops across all partitions
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          KIND: ${{ inputs.kind || (github.event.schedule == '9,24,39,54 * * * *' && 'metadata' || 'slots') }}
        run: python scraper/general_shop_refresh.py "$KIND"
