name: Resolve public shop candidates
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: resolve-public-candidates
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify business names, street numbers and coordinates in four rotating address partitions
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
        run: python scraper/resolve_public_candidates.py
