name: Archive shop portfolio photo candidates
on:
  schedule:
    - cron: '42 * * * *'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: business-photo-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --only-binary=:all: Pillow==13.0.0
      - name: Archive verified business stills
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
        run: python scraper/archive_business_photos.py
