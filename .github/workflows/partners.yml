name: partner-sync

on:
  schedule:
    - cron: "3-58/5 * * * *"
    - cron: "11 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [fast, details]
        default: fast

permissions:
  contents: read

jobs:
  fast:
    if: github.event.schedule != '11 * * * *' && github.event.inputs.mode != 'details'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: partner-refresh-fast
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Refresh live partners (slots, due events)
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          PARTNER_BUDGET_SEC: "210"
        run: python scraper/partner_refresh.py

  details:
    if: github.event.schedule == '11 * * * *' || github.event.inputs.mode == 'details'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: partner-refresh-details
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Playwright 설치
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: 파트너 동기화 (사진·가격 재수집)
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          PARTNER_BUDGET_SEC: "600"
        run: |
          if python scraper/partner_refresh.py details; then
            exit 0
          fi
          echo "::warning::Retrying remaining due partners in a fresh browser (120-second budget)"
          sleep 5
          PARTNER_BUDGET_SEC=120 python scraper/partner_refresh.py details
