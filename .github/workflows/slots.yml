name: slot-ingest

on:
  schedule:
    - cron: "0 * * * *" # 한 시각에 하나의 논리 샤드를 처리한다.
    - cron: "30 * * * *" # 다음 논리 샤드
  workflow_dispatch: {}

concurrency:
  group: slot-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - id: catalog
        name: Check nationwide slot schedule
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
        run: python3 scraper/daily_slots.py mode --published 20261128 >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.catalog.outputs.mode == 'legacy'
        with:
          python-version: "3.11"
      - name: Restore legacy progress
        if: steps.catalog.outputs.mode == 'legacy'
        uses: actions/cache/restore@v4
        with:
          path: legacy-slot-progress.json
          key: legacy-slot-progress-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: legacy-slot-progress-
      - name: Ingest slots → RDS (백엔드 internal API)
        id: ingest
        if: steps.catalog.outputs.mode == 'legacy'
        env:
          # 새로 생긴 빈자리를 백엔드 알림으로 밀어줌 (없으면 알림만 skip, 수집은 정상)
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          LEGACY_SLOT_CURSOR: "legacy-slot-progress.json"
          BUDGET_SEC: "780"
        run: python scraper/slot_ingest.py
      - name: Save confirmed legacy progress
        if: always() && steps.ingest.outputs.progress == 'true'
        uses: actions/cache/save@v4
        with:
          path: legacy-slot-progress.json
          key: legacy-slot-progress-${{ github.run_id }}-${{ github.run_attempt }}
