name: slot-ingest

on:
  schedule:
    - cron: "0 * * * *" # 한 시각에 하나의 논리 샤드를 처리한다.
    - cron: "30 * * * *" # 다음 논리 샤드
  workflow_dispatch: {}

concurrency:
  group: slot-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - id: catalog
        name: Check nationwide slot schedule
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
        run: python3 scraper/daily_slots.py mode --published 20261128 >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.catalog.outputs.mode == 'legacy'
        with:
          python-version: "3.11"
      - name: 시간대로 그룹(샤드) 결정
        if: steps.catalog.outputs.mode == 'legacy'
        run: echo "SHARD=$(( $(date -u +%s) / 1800 % 6 ))" >> "$GITHUB_ENV"
      - name: Ingest slots → RDS (백엔드 internal API)
        if: steps.catalog.outputs.mode == 'legacy'
        env:
          # 새로 생긴 빈자리를 백엔드 알림으로 밀어줌 (없으면 알림만 skip, 수집은 정상)
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          NUM_SHARDS: "6"
          BUDGET_SEC: "780"
        run: python scraper/slot_ingest.py
