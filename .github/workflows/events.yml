name: event-ingest

on:
  schedule:
    - cron: "30 */3 * * *"
  workflow_dispatch: {} # 수동 실행 버튼

concurrency:
  group: event-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 18 # 시간예산 14분 + 여유. 빠른실패라 차단돼도 안 멈춤.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Ingest event observations"
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          NUM_SHARDS: "4"
          BUDGET_SEC: "840"
        run: SHARD=$(( $(date -u +%s) / 10800 % 4 )) python scraper/enrich_events.py
