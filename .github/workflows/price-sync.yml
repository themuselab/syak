name: price-sync

# 네이버 가격 변경 → 앱 반영. 전국 4만을 한 번에 X, '가장 오래 안 본 샵'부터 롤링 갱신.
# 다른 작업과 공유하는 네이버 요청 예산 안에서 가장 오래된 샵부터 확인한다.
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      batch:
        description: "이번 런 처리량(기본 200)"
        required: false
        default: "200"

concurrency:
  group: price-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # 스크랩 예산 10분 + 저장 여유
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Sync prices·hours·rating·reviews ← Naver
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          PRICE_BATCH: ${{ github.event.inputs.batch || '200' }}
          BUDGET_SEC: "600"
        run: python scraper/price_sync.py
